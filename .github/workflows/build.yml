name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#4355b9' --iconBackgroundColorDark '#4355b9'
      - run: npx cap sync android
      - name: Verify native speech is installed
        run: |
          grep -q AndroidTTS android/app/src/main/java/com/kanadojo/app/MainActivity.java || grep -q TTSBridge android/app/src/main/java/com/kanadojo/app/MainActivity.java
          ls android/app/src/main/java/com/kanadojo/app/
          grep -n TTS_SERVICE android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KanaDojo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
